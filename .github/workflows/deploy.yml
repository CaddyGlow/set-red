name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  app:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # public.cfAccessEnabled and public.authPublicSignupEnabled are resolved at
      # build time: the SPA client cannot read server-side env vars.
      - name: Build
        run: pnpm build
        env:
          NUXT_CF_ACCESS_TEAM_DOMAIN: ${{ secrets.NUXT_CF_ACCESS_TEAM_DOMAIN }}
          NUXT_CF_ACCESS_AUD: ${{ secrets.NUXT_CF_ACCESS_AUD }}
          NUXT_AUTH_PUBLIC_SIGNUP_ENABLED: ${{ vars.NUXT_AUTH_PUBLIC_SIGNUP_ENABLED }}

      # Regenerates wrangler.deploy.jsonc from wrangler.jsonc plus DEPLOY_*, applies
      # remote D1 migrations, then publishes.
      - name: Apply migrations and deploy
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_D1_DATABASE_ID: ${{ secrets.DEPLOY_D1_DATABASE_ID }}
          DEPLOY_D1_DATABASE_NAME: ${{ vars.DEPLOY_D1_DATABASE_NAME }}
          DEPLOY_KV_NAMESPACE_ID: ${{ secrets.DEPLOY_KV_NAMESPACE_ID }}
          DEPLOY_R2_BUCKET_NAME: ${{ vars.DEPLOY_R2_BUCKET_NAME }}
          DEPLOY_ANALYTICS_DATASET: ${{ vars.DEPLOY_ANALYTICS_DATASET }}

  docs:
    name: Deploy docs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy docs
        run: pnpm --filter @set/docs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
