name: ci

# Pushes to master are verified through deploy.yml, which calls this workflow.
# Triggering on push as well would make the two runs cancel each other through
# the shared concurrency group.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check locale contracts
        run: pnpm locales:check

      - name: Check types
        run: pnpm types:check

      # Worker tests execute .output/server/index.mjs, so the build must run first
      # or the suite exercises stale output.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test --run
